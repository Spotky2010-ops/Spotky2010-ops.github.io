<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Window 12 Home</title>
    <meta name="description" content="Windows-inspired home screen concept for Spotky2010-ops.github.io" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="desktop-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">W</div>
          <div>
            <div class="app-label">Window 12</div>
            <div class="brand-subtitle">Home</div>
          </div>
        </div>

        <div class="system-meta">
          <span>Wi‑Fi</span>
          <span>Battery 92%</span>
          <span>10:24</span>
        </div>
      </header>

      <main class="home-layout">
        <aside class="glass panel side-panel left-panel">
          <div class="widget-label">Today</div>
          <div class="weather-box">
            <div class="weather-icon">☀</div>
            <div>
              <div class="temp">24°</div>
              <div class="condition">Clear</div>
            </div>
          </div>

          <div class="mini-stats">
            <div>
              <span class="metric">14</span>
              <span>tasks</span>
            </div>
            <div>
              <span class="metric">6</span>
              <span>alerts</span>
            </div>
          </div>
        </aside>

        <section class="hero-panel glass">
          <div class="greeting" id="greeting">Good evening</div>
          <h1 id="time">08:34</h1>
          <div class="date-row" id="date">Tuesday, October 28</div>

          <label class="search-bar" aria-label="Search">
            <span class="search-icon">⌕</span>
            <input type="text" value="Search apps, files, settings" aria-label="Search apps" />
          </label>
        </section>

        <aside class="glass panel side-panel right-panel">
          <div class="widget-label">Focus</div>
          <ul class="focus-list">
            <li><span class="dot blue"></span> Design review</li>
            <li><span class="dot green"></span> Build sprint</li>
            <li><span class="dot pink"></span> Team sync</li>
          </ul>
        </aside>
      </main>

      <section class="apps-section">
        <div class="apps-grid">
          <button class="app-tile tile-blue">
            <span class="tile-icon">✉</span>
            <span>Mail</span>
          </button>
          <button class="app-tile tile-cyan">
            <span class="tile-icon">▣</span>
            <span>Files</span>
          </button>
          <button class="app-tile tile-violet">
            <span class="tile-icon">⌘</span>
            <span>Store</span>
          </button>
          <button class="app-tile tile-green">
            <span class="tile-icon">⌬</span>
            <span>Terminal</span>
          </button>
          <button class="app-tile tile-orange">
            <span class="tile-icon">⚙</span>
            <span>Settings</span>
          </button>
          <button class="app-tile tile-pink">
            <span class="tile-icon">♫</span>
            <span>Music</span>
          </button>
          <button class="app-tile tile-red">
            <span class="tile-icon">◌</span>
            <span>Photos</span>
          </button>
          <button class="app-tile tile-windows">
            <span class="tile-icon">⊞</span>
            <span>Windows App</span>
          </button>
        </div>
      </section>

      <section class="files-gallery" aria-label="Files app folders">
        <div class="section-header">
          <div class="widget-label">Files</div>
          <span class="section-pill">3 folders</span>
        </div>

        <div class="files-tabs" aria-label="Files tabs">
          <button class="files-tab active" data-tab="all" type="button">All</button>
          <button class="files-tab" data-tab="cat" type="button">Cat</button>
          <button class="files-tab" data-tab="dog" type="button">Dog</button>
          <button class="files-tab" data-tab="robot" type="button">Robot</button>
        </div>

        <div class="folder-grid">
          <article class="folder-card" data-category="cat">
            <div class="folder-top">
              <div class="folder-icon">📁</div>
              <span>Cat</span>
            </div>
            <div class="thumbnail-grid">
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?auto=format&fit=crop&w=1600&q=80" alt="Cat photo 1" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=1600&q=80" alt="Cat photo 2" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1574158622682-e40e69881006?auto=format&fit=crop&w=1600&q=80" alt="Cat photo 3" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?auto=format&fit=crop&w=1600&q=80" alt="Cat photo 4" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=1600&q=80" alt="Cat photo 5" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1589883661923-6476cb0ae9f2?auto=format&fit=crop&w=1600&q=80" alt="Cat photo 6" loading="lazy" />
            </div>
            <div class="folder-footer">6 photos</div>
          </article>

          <article class="folder-card" data-category="dog">
            <div class="folder-top">
              <div class="folder-icon">📁</div>
              <span>Dog</span>
            </div>
            <div class="thumbnail-grid">
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1537151625747-768eb6cf92b5?auto=format&fit=crop&w=1600&q=80" alt="Dog photo 1" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=1600&q=80" alt="Dog photo 2" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1600&q=80" alt="Dog photo 3" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1600&q=80" alt="Dog photo 4" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=900&q=80" alt="Dog photo 5" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1534361960057-19889db9621e?auto=format&fit=crop&w=1600&q=80" alt="Dog photo 6" loading="lazy" />
            </div>
            <div class="folder-footer">6 photos</div>
          </article>

          <article class="folder-card" data-category="robot">
            <div class="folder-top">
              <div class="folder-icon">📁</div>
              <span>Roborock</span>
            </div>
            <div class="thumbnail-grid">
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?auto=format&fit=crop&w=1600&q=80" alt="Robot photo 1" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1617791160536-7b9a0f5f3d4b?auto=format&fit=crop&w=1600&q=80" alt="Robot photo 2" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=1600&q=80" alt="Robot photo 3" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1564466809058-bf4114d55352?auto=format&fit=crop&w=1600&q=80" alt="Robot photo 4" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1600&q=80" alt="Robot photo 5" loading="lazy" />
              <img class="thumb thumb-photo" src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80" alt="Robot photo 6" loading="lazy" />
              <img class="thumb thumb-photo" src="https://i.ibb.co/0yvQtgTb/20260830-153749.jpg?auto=format&fit=crop&w=1600&q=80" alt="Roborock photo 1" loading="lazy" />
              <img class="thumb thumb-photo" src="https://i.ibb.co/JWdDX12L/20260504-164607.jpg?auto=format&fit=crop&w=1600&q=80" alt="Roborock photo 2" loading="lazy" />
              <img class="thumb thumb-photo" src="https://i.ibb.co/3mQMHRnw/20260322-164525.jpg?auto=format&fit=crop&w=1600&q=80" alt="Roborock photo 3" loading="lazy" />            </div>
            <div class="folder-footer">9 photos</div>
          </article>
        </div>
      </section>

      <nav class="dock glass" aria-label="Dock">
        <button class="dock-item active" aria-label="Home">
          <span>⌂</span>
        </button>
        <button class="dock-item" aria-label="Explorer">
          <span>▣</span>
        </button>
        <button class="dock-item" aria-label="Browser">
          <span>◎</span>
        </button>
        <button class="dock-item" aria-label="Music">
          <span>♫</span>
        </button>
        <button class="dock-item" aria-label="Settings">
          <span>⚙</span>
        </button>
        <button id="powerButton" class="dock-item power-button" aria-label="Power options" title="Power options">
          <span>⏻</span>
        </button>
      </nav>
    </div>

    <div class="power-overlay" id="powerOverlay" aria-hidden="true">
      <div class="power-panel" role="dialog" aria-modal="true" aria-labelledby="powerTitle">
        <div class="power-header">
          <div class="power-badge">⏻</div>
          <div>
            <div class="power-kicker">Power</div>
            <h2 id="powerTitle">Choose an action</h2>
          </div>
        </div>

        <div class="power-actions">
          <button class="power-option primary" data-action="shutdown">
            <span class="option-icon">⏻</span>
            <span>Shut down</span>
          </button>
          <button class="power-option" data-action="sleep">
            <span class="option-icon">☾</span>
            <span>Sleep</span>
          </button>
          <button class="power-option" data-action="restart">
            <span class="option-icon">↻</span>
            <span>Restart</span>
          </button>
        </div>

        <div class="power-footer">
          <button class="action-btn secondary" id="closePowerMenu">Cancel</button>
          <button class="action-btn primary" id="confirmPowerAction">Confirm</button>
        </div>
      </div>
    </div>

    <div class="blackout-screen" id="blackoutScreen" aria-hidden="true">
      <div class="shutdown-text">Shutting down...</div>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close image">×</button>
      <img id="lightboxImage" src="" alt="Expanded photo" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
